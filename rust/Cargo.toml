[workspace]
members = ["vllm-omni-rs"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# vLLM Rust frontend lib crates are consumed from the sibling checkout; its
# member crates resolve `workspace = true` inheritance against that checkout's
# own workspace root, so no path rewriting is needed here.
[workspace.dependencies]
vllm-chat = { path = "../../vllm/rust/src/chat" }
vllm-engine-core-client = { path = "../../vllm/rust/src/engine-core-client" }
vllm-server = { path = "../../vllm/rust/src/server" }
vllm-tracing = { path = "../../vllm/rust/src/tracing" }

anyhow = "1.0.100"
clap = { version = "4.5.38", features = ["derive", "env"] }
futures = "0.3.31"
libc = "0.2.177"
rmp-serde = "1.3.1"
reqwest = { version = "0.12.8", default-features = false, features = ["json", "stream"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
thiserror = "2.0.16"
thiserror-ext = "0.3.0"
tokio = { version = "1.47.1", features = [
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
zeromq = { version = "0.6.0", default-features = false, features = [
    "tokio-runtime",
    "all-transport",
] }

[workspace.lints.clippy]
too_many_arguments = "allow"

[profile.release]
lto = "thin"
panic = "abort"
